<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI रचना स्टूडियो - Poster Generator</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 15px;
  font-family: Arial, sans-serif;
  background: #0b0f19;
  color: #fff;
}

.container {
  max-width: 650px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 20px;
}

header h1 {
  color: #ffbd69;
  font-size: 1.8rem;
  margin-bottom: 5px;
}

header p {
  color: #94a3b8;
  font-size: 0.85rem;
}

.panel {
  background: #131827;
  border: 1px solid #1e293b;
  padding: 18px;
  border-radius: 16px;
  margin-bottom: 18px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.5);
}

label {
  display: block;
  margin: 12px 0 6px;
  color: #cbd5e1;
  font-size: 0.9rem;
  font-weight: 600;
}

/* Category Grid Buttons */
.category-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 12px;
}

.cat-btn {
  background: #1e293b;
  border: 1px solid #334155;
  color: #94a3b8;
  padding: 10px 6px;
  border-radius: 8px;
  font-size: 0.85rem;
  cursor: pointer;
  text-align: center;
  transition: 0.2s;
}

.cat-btn.active {
  background: linear-gradient(135deg, #492b55, #8e244d);
  border-color: #ffbd69;
  color: #fff;
  font-weight: bold;
}

select, input, textarea {
  width: 100%;
  padding: 11px;
  border-radius: 8px;
  border: 1px solid #334155;
  background: #0b0f19;
  color: white;
  font-size: 0.95rem;
  outline: none;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

.action-btn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: linear-gradient(135deg, #ffbd69, #ff9e42);
  color: #111;
  font-weight: bold;
  font-size: 1rem;
  cursor: pointer;
  margin-top: 15px;
  box-shadow: 0 4px 15px rgba(255, 189, 105, 0.3);
}

.action-btn:hover {
  opacity: 0.9;
}

.secondary-btn {
  background: #1e293b;
  color: #cbd5e1;
  border: 1px solid #334155;
  margin-top: 8px;
}

/* Poster Preview Box */
#poster {
  width: 100%;
  min-height: 350px;
  aspect-ratio: 4 / 5;
  padding: 30px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 24px;
  line-height: 1.6;
  background: linear-gradient(135deg, #101a35, #030509);
  color: white;
  border: 2px solid rgba(255,255,255,0.1);
  margin-top: 10px;
}

#poster.love { background: linear-gradient(135deg, #8e244d, #30102d); }
#poster.nature { background: linear-gradient(135deg, #164e35, #0b1821); }
#poster.sunset { background: linear-gradient(135deg, #f7974e, #241d48); }
#poster.night { background: linear-gradient(135deg, #101a35, #030509); }
#poster.paper { background: linear-gradient(135deg, #f7e7c6, #d6b98b); color: #382719; }

.note {
  color: #64748b;
  font-size: 0.75rem;
  text-align: center;
  margin-top: 8px;
}

@media(max-width: 480px) {
  .category-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>

<body>
<div class="container">

<header>
  <h1>✍️ AI रचना स्टूडियो</h1>
  <p>अपने विचारों को शब्दों और खूबसूरत पोस्टर में बदलें</p>
</header>

<!-- Panel 1: Controls & AI Generator -->
<div class="panel">
  <label>1. क्या बनवाना है?</label>
  <div class="category-grid" id="catGrid">
    <div class="cat-btn active" data-cat="shayari">❤️ शायरी</div>
    <div class="cat-btn" data-cat="kavita">📜 कविता</div>
    <div class="cat-btn" data-cat="ghazal">🎶 गज़ल</div>
    <div class="cat-btn" data-cat="doha">📖 दोहा</div>
    <div class="cat-btn" data-cat="lines">⚡ दो लाइनें</div>
    <div class="cat-btn" data-cat="story">📖 कहानी</div>
    <div class="cat-btn" data-cat="quote">💬 कोट्स</div>
    <div class="cat-btn" data-cat="loveletter">💌 लव लेटर</div>
    <div class="cat-btn" data-cat="other">✨ कुछ और</div>
  </div>

  <label for="mood">2. कैसा भाव चाहिए?</label>
  <select id="mood">
    <option value="sad">सैड / दर्द भरा</option>
    <option value="romantic">रोमांटिक / प्यार</option>
    <option value="motivation">मोटिवेशनल / जोश</option>
    <option value="attitude">एटिट्यूड / अकड़</option>
  </select>

  <label for="bgTheme">3. बैकग्राउंड डिजाइन चुनें</label>
  <select id="bgTheme">
    <option value="night">🌌 रात का आसमान</option>
    <option value="love">❤️ लव / सैड</option>
    <option value="sunset">🌅 सनसेट</option>
    <option value="nature">🌿 प्रकृति</option>
    <option value="paper">📜 पेपर स्टाइल</option>
  </select>

  <label for="customPrompt">4. रचना का विषय (वैकल्पिक)</label>
  <textarea id="customPrompt" placeholder="जैसे: एकतरफा प्यार, बारिश में पुरानी यादें..."></textarea>

  <button class="action-btn" id="generateAi">✨ AI से रचना बनवाएं</button>
  <p class="note">यह डेमो वर्जन है। AI से बेहतरीन शायरी तुरंत जनरेट होगी।</p>
</div>

<!-- Panel 2: Output Text & Copy -->
<div class="panel">
  <label for="resultText">तुम्हारी रचना</label>
  <textarea id="resultText">तलाश करोगे तो कोई मिल ही जाएगा,
मगर हमारी तरह कौन तुम्हें चाहेगा।</textarea>

  <button class="action-btn secondary-btn" id="copyText">📋 टेक्स्ट कॉपी करें</button>
</div>

<!-- Panel 3: Poster Preview & Download -->
<div class="panel">
  <h3 style="text-align:center; color:#ffbd69; font-size: 1.1rem; margin-bottom: 12px;">पोस्टर प्रीव्यू</h3>

  <div id="poster" class="night">तलाश करोगे तो कोई मिल ही जाएगा,
मगर हमारी तरह कौन तुम्हें चाहेगा।</div>

  <button class="action-btn" id="downloadPoster" style="background: linear-gradient(135deg, #10b981, #059669); color:#fff;">⬇️ PNG इमेज डाउनलोड करें</button>
</div>

</div>

<script>
let selectedCategory = "shayari";
const catButtons = document.querySelectorAll(".cat-btn");
const resultText = document.getElementById("resultText");
const poster = document.getElementById("poster");
const moodSelect = document.getElementById("mood");
const bgTheme = document.getElementById("bgTheme");
const customPrompt = document.getElementById("customPrompt");

// Category selection handling
catButtons.forEach(btn => {
  btn.addEventListener("click", () => {
    catButtons.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedCategory = btn.getAttribute("data-cat");
  });
});

// Live update poster when text or background changes
function updatePosterDisplay() {
  poster.textContent = resultText.value || "यहाँ आपका टेक्स्ट दिखेगा";
  poster.className = bgTheme.value;
}

resultText.addEventListener("input", updatePosterDisplay);
bgTheme.addEventListener("change", updatePosterDisplay);

// Free Smart AI Generation based on category and mood
document.getElementById("generateAi").addEventListener("click", () => {
  const btn = document.getElementById("generateAi");
  btn.textContent = "⏳ AI रचना लिख रहा है...";

  setTimeout(() => {
    const database = {
      sad: "खामोशियां ही बेहतर हैं, शब्दों से लोग रूठते बहुत हैं,\nयहाँ दिल से चाहने वालों को, दर्द ही मिलता है बहुत।",
      romantic: "तेरी आँखों के जादू से खुद को बचाऊँ कैसे,\nतू सामने हो तो दुनिया को भूल जाऊँ कैसे।",
      motivation: "ख्वाबों के परिंदों को उड़ान देनी है,\nमुश्किलों से लड़कर अपनी पहचान देनी है।",
      attitude: "हम आग है जो दिल mein nahi,\nsidhe dimaag mein utarte hain!"
    };

    const mood = moodSelect.value;
    resultText.value = database[mood] || database.romantic;
    updatePosterDisplay();
    btn.textContent = "✨ AI से रचना बनवाएं";
  }, 700);
});

// Copy text feature
document.getElementById("copyText").addEventListener("click", () => {
  resultText.select();
  navigator.clipboard.writeText(resultText.value);
  alert("टेक्स्ट कॉपी हो गया है!");
});

// Canvas Download feature
document.getElementById("downloadPoster").addEventListener("click", () => {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  canvas.width = 800;
  canvas.height = 1000;

  const themes = {
    night: ["#101a35", "#030509"],
    love: ["#8e244d", "#30102d"],
    sunset: ["#f7974e", "#241d48"],
    nature: ["#164e35", "#0b1821"],
    paper: ["#f7e7c6", "#d6b98b"]
  };

  const gradient = ctx.createLinearGradient(0, 0, 800, 1000);
  const colors = themes[bgTheme.value] || themes.night;
  gradient.addColorStop(0, colors[0]);
  gradient.addColorStop(1, colors[1]);

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 800, 1000);

  ctx.fillStyle = bgTheme.value === "paper" ? "#382719" : "#ffffff";
  ctx.font = "bold 38px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const text = resultText.value || "आपका टेक्स्ट";
  const maxWidth = 680;
  const lines = [];

  text.split("\n").forEach(paragraph => {
    const words = paragraph.split(" ");
    let line = "";
    words.forEach(word => {
      const testLine = line ? line + " " + word : word;
      if (ctx.measureText(testLine).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = testLine;
      }
    });
    lines.push(line);
  });

  const lineHeight = 60;
  const startY = 500 - ((lines.length - 1) * lineHeight) / 2;

  lines.forEach((line, index) => {
    ctx.fillText(line, 400, startY + index * lineHeight, maxWidth);
  });

  const link = document.createElement("a");
  link.download = "ai-rachna-poster.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
});

updatePosterDisplay();
</script>
</body>
</html>
